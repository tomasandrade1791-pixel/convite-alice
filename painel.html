<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel da Alice</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><style>:root{--c:#f4ead5;--b:#163e70;--g:#c8a66b;--i:#18263a}*{box-sizing:border-box}body{margin:0;background:#000;color:var(--i);font-family:Georgia,serif}.wrap{max-width:900px;margin:auto;padding:16px}.card{background:var(--c);border-radius:16px;padding:20px;margin:14px 0}h1,h2{text-align:center;color:var(--b)}input{width:100%;padding:12px;border:1px solid #bbaF93;border-radius:10px;font:inherit;margin:5px 0 12px}.btn{border:1px solid var(--g);border-radius:999px;padding:11px 16px;background:var(--c);color:var(--b);font-weight:bold;font:inherit}.tabs{display:flex;gap:8px;overflow:auto}.tab.active{background:var(--b);color:var(--c)}.panel{display:none}.panel.active{display:block}.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:12px 0}.item{border:1px solid #cbbd9e;border-radius:12px;padding:12px;margin:8px 0}.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}.gift{display:grid;grid-template-columns:1fr 90px;gap:8px;align-items:center}.muted{opacity:.7;font-size:13px}.status{text-align:center;min-height:22px}.ok{color:#27653d}.err{color:#9a2525}.pill{float:right;background:#e6dac0;padding:4px 8px;border-radius:20px;font-size:13px}.msg{white-space:pre-wrap;line-height:1.55}@media(max-width:650px){.grid{grid-template-columns:1fr}.card{border-radius:10px}}</style></head><body><div class="wrap"><div id="login" class="card"><h1>💙 Painel dos papais</h1><p style="text-align:center">Área privada do convite da Alice.</p><label>E-mail</label><input id="email" type="email" value="tomasandrade1791@gmail.com"><label>Senha</label><input id="password" type="password"><div class="actions"><button class="btn" id="loginBtn">ENTRAR</button><button class="btn" id="magicBtn">ENVIAR LINK POR E-MAIL</button></div><div id="loginStatus" class="status"></div></div><div id="app" hidden><div class="card"><h1>⭐ Painel da Alice ⭐</h1><div id="who" style="text-align:center"></div><div class="actions"><button class="btn" id="refresh">↻ ATUALIZAR</button><button class="btn" id="logout">SAIR</button></div><div id="status" class="status"></div></div><div class="card"><div class="tabs"><button class="btn tab active" data-t="event">📅 Evento</button><button class="btn tab" data-t="gifts">🎁 Presentes</button><button class="btn tab" data-t="guests">👥 Convidados</button><button class="btn tab" data-t="messages">💌 Cartinhas</button></div><section id="event" class="panel active"><h2>📅 Dados do evento</h2><div class="grid"><div><label>Data</label><input id="date"></div><div><label>Horário</label><input id="time"></div><div><label>Local</label><input id="place"></div></div><div class="actions"><button class="btn" id="saveEvent">💾 SALVAR</button></div></section><section id="gifts" class="panel"><h2>🎁 Quantidades</h2><p style="text-align:center">Escolhidos / limite definido por você.</p><div id="giftList"></div><div class="actions"><button class="btn" id="saveGifts">💾 SALVAR QUANTIDADES</button></div></section><section id="guests" class="panel"><h2>👥 Confirmações</h2><div id="guestList"></div></section><section id="messages" class="panel"><h2>💌 Cartinhas para Alice</h2><div id="messageList"></div></section></div></div></div><script>
const ADMIN='tomasandrade1791@gmail.com',G=['Pacote de fraldas M','Pacote de fraldas G','Pacote de fraldas XG','Lenços umedecidos','Sabonete líquido para bebê','Creme/pomada para assaduras','Kit de higiene para bebê','Fraldas de pano','Meias','Casaquinho','Touquinha','Babadores','Toalha de banho','Toalha com capuz','Kit de toalhinhas','Escova para mamadeira','Babador impermeável','Paninhos de boca','Lençol para berço','Protetor de colchão','Manta','Cueiro','Cobertor apropriado para bebê','Manta personalizada','Toalha personalizada','Kit de saída da maternidade','Vale-presente de loja infantil','Presente escolhido livremente — algo que o convidado considere útil para a Alice ou a mamãe.'];const $=x=>document.getElementById(x);let D={};const norm=x=>String(x||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');const v=(o,n,d='')=>{for(const x of n)if(o&&o[x]!=null)return o[x];return d};const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function stat(x,ok=false){$('status').textContent=x;$('status').className='status '+(ok?'ok':'err')}function ls(x,ok=false){$('loginStatus').textContent=x;$('loginStatus').className='status '+(ok?'ok':'err')}
async function auth(){let {data:{session}}=await AliceDB.auth.getSession();if(!session){$('login').hidden=false;$('app').hidden=true;return false}if((session.user.email||'').toLowerCase()!=ADMIN){await AliceDB.auth.signOut();ls('Este e-mail não tem autorização.');return false}$('login').hidden=true;$('app').hidden=false;$('who').textContent='Acesso autorizado: '+session.user.email;return true}async function load(){stat('Atualizando...',true);let {data,error}=await AliceDB.rpc('painel_admin_alice');if(error){stat('Erro: '+error.message);return}D=data||{};render();stat('Dados atualizados.',true)}function render(){let e=D.evento||{};$('date').value=v(e,['data_evento','dataEvento']);$('time').value=v(e,['horario','hora']);$('place').value=v(e,['local_evento','local']);let lim=D.limites||[],taken=D.presentes||[],lm=new Map(lim.map(x=>[norm(v(x,['presente','Presente'])),Number(v(x,['quantidade_total','quantidadeTotal'],0))])),ct=new Map();taken.forEach(x=>{let k=norm(v(x,['presente','Presente']));if(k)ct.set(k,(ct.get(k)||0)+1)});$('giftList').innerHTML=G.map((n,i)=>{let k=norm(n),u=ct.get(k)||0,t=lm.has(k)?lm.get(k):0;return `<div class="item gift"><div><b>${esc(n)}</b><div class="muted">${u}/${t} escolhidos</div></div><input class="gl" data-n="${esc(n)}" type="number" min="0" value="${t}"></div>`}).join('');let c=D.confirmacoes||[],p=D.presentes||[],m=D.mensagens||[];$('guestList').innerHTML=c.length?c.slice().reverse().map(x=>{let n=v(x,['Nome','nome'],'Sem nome'),yes=Boolean(v(x,['Confirmou','confirmou'],false)),g=p.find(z=>norm(v(z,['nome','Nome']))==norm(n)),mm=m.find(z=>norm(v(z,['nome','Nome']))==norm(n));return `<div class="item"><span class="pill">${yes?'💙 Confirmou':'🤍 Não confirmou'}</span><b>${esc(n)}</b><p>🎁 ${esc(g?v(g,['presente','Presente']):'Nenhum presente registrado')}</p>${mm?`<div class="msg">💌 ${esc(v(mm,['mensagem','Mensagem']))}</div>`:''}</div>`}).join(''):'<p style="text-align:center">Ainda não há confirmações.</p>';$('messageList').innerHTML=m.length?m.slice().reverse().map(x=>`<div class="item"><b>${esc(v(x,['nome','Nome'],'Sem nome'))}</b><div class="msg">${esc(v(x,['mensagem','Mensagem']))}</div></div>`).join(''):'<p style="text-align:center">Ainda não há cartinhas.</p>'}
$('loginBtn').onclick=async()=>{let e=$('email').value.trim().toLowerCase(),p=$('password').value;if(e!=ADMIN){ls('Use somente o e-mail autorizado.');return}if(!p){ls('Digite a senha ou use o link por e-mail.');return}ls('Entrando...',true);let {error}=await AliceDB.auth.signInWithPassword({email:e,password:p});if(error){ls('Não foi possível entrar: '+error.message);return}await auth();if(await auth())load()};$('magicBtn').onclick=async()=>{let e=$('email').value.trim().toLowerCase();if(e!=ADMIN){ls('Use somente o e-mail autorizado.');return}ls('Enviando link...',true);let {error}=await AliceDB.auth.signInWithOtp({email:e,options:{emailRedirectTo:location.href,shouldCreateUser:false}});if(error)ls('Erro: '+error.message);else ls('Link enviado para seu e-mail.',true)};$('logout').onclick=async()=>{await AliceDB.auth.signOut();auth()};$('refresh').onclick=load;$('saveEvent').onclick=async()=>{let q={data_evento:$('date').value.trim(),horario:$('time').value.trim(),local_evento:$('place').value.trim(),updated_at:new Date().toISOString()};if(!q.data_evento||!q.horario||!q.local_evento){stat('Preencha data, horário e local.');return}let {error}=await AliceDB.from('evento_alice').update(q).eq('id',1);if(error)stat('Erro: '+error.message);else stat('Dados do evento salvos.',true)};$('saveGifts').onclick=async()=>{stat('Salvando quantidades...',true);for(let x of document.querySelectorAll('.gl')){let {error}=await AliceDB.from('limites_presentes_alice').upsert({presente:x.dataset.n,quantidade_total:Math.max(0,parseInt(x.value||0,10)),updated_at:new Date().toISOString()},{onConflict:'presente'});if(error){stat('Erro: '+error.message);return}}load()};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.t).classList.add('active')});(async()=>{if(!window.AliceDB){ls('Supabase não foi inicializado.');return}AliceDB.auth.onAuthStateChange(()=>setTimeout(auth,0));if(await auth())load()})();
</script></body></html>
